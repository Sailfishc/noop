name: Set up nsh for packaging
description: >
  Puts on PATH the nsh CLI pinned in app/nsh-version with the runtime `nsh package` needs for one desktop target.
  Linux: the CLI from this repository's `nsh-<commit>` release (scripts/install-nsh.sh) plus a GTK-only runtime built
  here, since the distribution's runtime links WebKitGTK and Remi shows no web views. macOS: built from source.
  Both builds are cached by the pin, so only an NSH upgrade pays for them.
inputs:
  target:
    description: linux or macos
    required: true
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        pin="$(tr -d ' \n' < app/nsh-version)"
        echo "pin=$pin" >> "$GITHUB_OUTPUT"
        echo "short=${pin:0:12}" >> "$GITHUB_OUTPUT"

    - if: inputs.target == 'linux'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libclang-dev pkg-config libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
        dir="$(sh scripts/install-nsh.sh | tail -1)"
        echo "NSH_DIST=$(dirname "$dir")" >> "$GITHUB_ENV"
        echo "$dir" >> "$GITHUB_PATH"

    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.nsh-build
        key: nsh-build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ steps.pin.outputs.pin }}-v1

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: longbridge/nsh
        ref: ${{ steps.pin.outputs.pin }}
        path: .nsh-src
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@stable

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .nsh-src
      env:
        TARGET: ${{ inputs.target }}
      run: |
        out="$HOME/.nsh-build"
        case "$TARGET" in
          linux)
            # GTK 4 only (no WebKitGTK). Sending uses crypto.randomUUID(), which `js` alone leaves out.
            cargo build --release --locked -p nsh-linux-app --no-default-features --features js,crypto
            install -d "$out/runtime/linux"; cp target/release/nsh-linux-app "$out/runtime/linux/" ;;
          macos)
            cargo build --release --locked -p nsh-cli -p nsh-macos-app
            install -d "$out/bin" "$out/runtime/macos"
            cp target/release/nsh "$out/bin/"; cp target/release/nsh-macos-app "$out/runtime/macos/" ;;
          *) echo "::error::unknown target $TARGET"; exit 1 ;;
        esac
        rm -rf "$GITHUB_WORKSPACE/.nsh-src"

    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        if [ "$TARGET" = linux ]; then
          cp "$HOME/.nsh-build/runtime/linux/nsh-linux-app" "$NSH_DIST/runtime/linux/nsh-linux-app"
        else
          echo "$HOME/.nsh-build/bin" >> "$GITHUB_PATH"
        fi
