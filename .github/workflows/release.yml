# Releases the client apps and the update feed installed apps follow (docs/app-updates.md).
#
# A tag `vX.Y.Z` packages Remi for macOS (Apple silicon) and Linux, signs an OTA package of the app's code, writes the
# signed update manifest (latest.json) and publishes them as the latest GitHub release. Installed apps read
# `releases/latest/download/latest.json`; install-client.sh reads the unversioned assets next to it.
# Pull requests touching the release files, and a run by hand, only package (workflow artifacts, no keys needed).
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-nsh/**
      - scripts/release-config.sh
      - install-client.sh
      - app/nsh.json
      - app/nsh-version
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos, os: macos-15, asset: remi-macos-arm64.zip }
          - { target: linux, os: ubuntu-24.04, asset: remi-linux-x86_64.tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nsh
        with:
          target: ${{ matrix.target }}
      - name: Version and update keys
        env:
          REMI_UPDATE_ROOT: ${{ vars.REMI_UPDATE_ROOT }}
          REMI_UPDATE_KEY: ${{ vars.REMI_UPDATE_KEY }}
          REQUIRE_KEYS: ${{ github.ref_type == 'tag' && '1' || '' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.0.0; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" scripts/release-config.sh
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p assets
          # The build number must grow with every release: the apps compare it to take an OTA package.
          (cd app && nsh package --target "$TARGET" -o "$out" --build "$GITHUB_RUN_NUMBER" --app-version "$VERSION")
          case "$TARGET" in
            linux) mv "$out/Remi.tar.gz" "assets/$ASSET"; mv "$out"/Remi-*.tar.gz assets/ ;;
            macos) ditto -c -k --keepParent "$out/Remi.app" "assets/$ASSET"; mv "$out"/Remi-*.tar.gz assets/ ;;
          esac
          ls -l assets
      - name: Verify the macOS package
        if: matrix.target == 'macos'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          app="$RUNNER_TEMP/verify/Remi.app"
          ditto -x -k "assets/$ASSET" "$RUNNER_TEMP/verify"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64
          # nsh/updater checks the downloaded app the same way before it swaps it in.
          codesign --verify --deep --strict "$app"
      - name: Try the installer on this package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          (cd assets && { command -v sha256sum > /dev/null && sha256sum "$ASSET" || shasum -a 256 "$ASSET"; } > sha256sums)
          (cd assets && exec python3 -m http.server 8765 > /dev/null 2>&1) &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          sleep 2
          export NOOP_CLIENT_BASE_URL=http://127.0.0.1:8765
          bash install-client.sh
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --verify --deep --strict /Applications/Remi.app
          else
            test -x "$HOME/.local/share/remi-client/Remi"
            test -x "$HOME/.local/bin/remi-client"
          fi
          rm assets/sha256sums
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: assets/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: echo "$(sh scripts/install-nsh.sh | tail -1)" >> "$GITHUB_PATH"
      - name: Version and update keys
        env:
          REMI_UPDATE_ROOT: ${{ vars.REMI_UPDATE_ROOT }}
          REMI_UPDATE_KEY: ${{ vars.REMI_UPDATE_KEY }}
          REQUIRE_KEYS: "1"
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          VERSION="${GITHUB_REF_NAME#v}" scripts/release-config.sh
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # Release file names are lowercase (nsh names its archives after the app: Remi-<version>-<os>-<arch>).
      - name: Lowercase asset names
        run: |
          cd assets
          for f in *; do l=$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]'); [ "$f" = "$l" ] || mv "$f" "$l"; done
          ls -l
      # The release key's secret is written to a private temp dir and removed in the same step.
      # OTA: the app's code as a package signed by the release key, whose certificate chains to the root the apps
      # trust. An installed app runs it from its next launch when its build is newer and its NSH runtime new enough;
      # otherwise it takes the whole app from the archives. latest.json lists both and is signed by the release key.
      - name: Sign the OTA package and the update manifest
        env:
          REMI_RELEASE_KEY: ${{ secrets.REMI_RELEASE_KEY }}
          REMI_RELEASE_CERT: ${{ secrets.REMI_RELEASE_CERT }}
        run: |
          [ -n "$REMI_RELEASE_KEY" ] && [ -n "$REMI_RELEASE_CERT" ] || {
            echo "::error::a release needs the secrets REMI_RELEASE_KEY and REMI_RELEASE_CERT (scripts/release-keys.sh)"; exit 1; }
          keys="$RUNNER_TEMP/keys"
          (umask 077 && mkdir -p "$keys" && printf '%s\n' "$REMI_RELEASE_KEY" > "$keys/release.secret")
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "$REMI_RELEASE_CERT" > "$keys/release.cert"
          pkg="assets/remi-$VERSION.nshpkg"
          (cd app && nsh publish App.tsx --key "$keys/release.secret" --cert "$keys/release.cert" \
            --build "$GITHUB_RUN_NUMBER" --app-version "$VERSION" -o "$GITHUB_WORKSPACE/$pkg")
          nsh update-manifest assets/remi-"$VERSION"-*.tar.gz --entry app --key "$keys/release.secret" \
            --package "$pkg" --out assets
          cat assets/latest.json
      # Uploaded as a draft, then published as latest: `releases/latest` never points at a release without its
      # latest.json (LoopMe's appcast rule). Drafts and prereleases are invisible to installed apps.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          sha256sum * > sha256sums
          cat sha256sums
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME exists already: tag a new version"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" * --draft --verify-tag --generate-notes --title "Remi $GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          echo "installed apps now update to $VERSION"
