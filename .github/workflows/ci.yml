name: ci
# A PR's commits run once (as the PR), not twice (push and PR); main runs on push.
on:
  push:
    branches: [main]
  pull_request:
# Borrowed from T3 Code's CI: read-only token, and a newer push to a PR cancels the older run.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Keys, tokens and IP addresses (docs/secret-scan.md). The same script runs as the
  # pre-commit hook. It scans every commit the push or PR adds, so a secret added and
  # then deleted in a later commit is still caught, and then the whole tree as it is.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with: { bun-version-file: package.json }
      - if: steps.bun.outcome == 'failure'
        run: npm install -g "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - name: Scan the commits this change adds
        env:
          # Optional repository secret: intranet domains and other names that must not
          # appear, one regex per line. It stays out of the repository by design.
          REMI_SENSITIVE_PATTERNS: ${{ secrets.REMI_SENSITIVE_PATTERNS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            bun scripts/check-secrets.ts --range "$BASE..$HEAD"
          else
            echo "no base commit (new branch): the full-tree scan below covers it"
          fi
      - name: Scan the whole tree
        env:
          REMI_SENSITIVE_PATTERNS: ${{ secrets.REMI_SENSITIVE_PATTERNS }}
        run: bun scripts/check-secrets.ts
  test:
    strategy: { matrix: { os: [ubuntu-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Bun's own download (GitHub release assets) sometimes answers 504 for hours; a pinned version stays cached,
      # and npm's copy of the same version is the fallback.
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with: { bun-version-file: package.json }
      - if: steps.bun.outcome == 'failure'
        run: npm install -g "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with: { bun-version-file: package.json }
      - if: steps.bun.outcome == 'failure'
        working-directory: .
        run: npm install -g "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: |
          go build -o /tmp/remi-server ./cmd/remi-server
          CODE=$(/tmp/remi-server invite -data /tmp/ta-team -email zhang@corp.com | tail -1 | sed 's|.*/invite/||')
          /tmp/remi-server -addr 127.0.0.1:18081 -data /tmp/ta-team &
          sleep 1
          bun test/e2e-team.ts http://127.0.0.1:18081 "$CODE"
          CODE=$(/tmp/remi-server invite -data /tmp/ta-dispatch -email zhang@corp.com | tail -1 | sed 's|.*/invite/||')
          /tmp/remi-server -addr 127.0.0.1:18082 -data /tmp/ta-dispatch &
          sleep 1
          git config --global user.name ci && git config --global user.email ci@ci
          bun test/e2e-dispatch.ts http://127.0.0.1:18082 "$CODE"
  # The NSH CLI the client is built with (app/nsh-version), built once per pinned commit
  # the way NSH's own release does (`cargo xtask dist`) and kept in the Actions cache.
  # A push also publishes it as the release `nsh-<commit>`, which Claude Code cloud
  # sessions download (scripts/install-nsh.sh, .claude/hooks/session-start.sh).
  nsh:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned commit
        id: pin
        run: |
          pin=$(tr -d ' \n' < app/nsh-version)
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "short=${pin:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: nsh-dist
          key: nsh-dist-linux-x86_64-${{ steps.pin.outputs.pin }}-v1
      # The Actions cache is per branch (a branch sees its own and main's), so a new branch
      # misses it until main has built. The release `nsh-<commit>` (published below) is the
      # same build: take it rather than spend an hour building it again.
      - if: steps.cache.outputs.cache-hit != 'true'
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nsh-${{ steps.pin.outputs.short }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D nsh-dist \
            -p nsh-linux-x86_64.tar.gz -p nsh-linux-x86_64.tar.gz.sha256
          cd nsh-dist && sha256sum --check nsh-linux-x86_64.tar.gz.sha256
      - if: steps.cache.outputs.cache-hit != 'true' && steps.release.outcome != 'success'
        uses: actions/checkout@v4
        with: { repository: longbridge/nsh, ref: "${{ steps.pin.outputs.pin }}", path: nsh-src }
      # What NSH's release.yml installs for its linux-x86_64 distribution.
      - if: steps.cache.outputs.cache-hit != 'true' && steps.release.outcome != 'success'
        name: Install clang, GTK 4 and GPUI's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - if: steps.cache.outputs.cache-hit != 'true' && steps.release.outcome != 'success'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - if: steps.cache.outputs.cache-hit != 'true' && steps.release.outcome != 'success'
        name: Install the Android platform
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager* | head -1)
            yes | "$sdkmanager" "platforms;android-35" > /dev/null || true
          fi
      - if: steps.cache.outputs.cache-hit != 'true' && steps.release.outcome != 'success'
        uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - if: steps.cache.outputs.cache-hit != 'true' && steps.release.outcome != 'success'
        name: Build the distribution
        working-directory: nsh-src
        env:
          CC_wasm32_unknown_unknown: /usr/bin/clang
          AR_wasm32_unknown_unknown: /usr/bin/llvm-ar
        run: |
          cargo xtask dist -v
          mkdir -p ../nsh-dist
          tar -czf ../nsh-dist/nsh-linux-x86_64.tar.gz -C dist nsh
          cd ../nsh-dist && sha256sum nsh-linux-x86_64.tar.gz > nsh-linux-x86_64.tar.gz.sha256
      - run: ls -l nsh-dist
      - uses: actions/upload-artifact@v4
        with: { name: nsh-linux-x86_64, path: nsh-dist/*, if-no-files-found: error }
      - name: Publish for cloud sessions
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nsh-${{ steps.pin.outputs.short }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already published"
          else
            gh release create "$TAG" nsh-dist/* --target "$GITHUB_SHA" --prerelease \
              --title "NSH CLI ${{ steps.pin.outputs.short }} (Linux x86_64)" \
              --notes "NSH CLI built from longbridge/nsh@${{ steps.pin.outputs.pin }} for CI and Claude Code cloud sessions (scripts/install-nsh.sh). Not a Remi release."
          fi
  # The client: NSH's real type check and the headless UI tests (app/*.test.tsx).
  app:
    needs: nsh
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nsh-linux-x86_64, path: nsh-dist }
      - name: Install nsh
        run: |
          cd nsh-dist && sha256sum --check nsh-linux-x86_64.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/nsh" && tar -xzf nsh-linux-x86_64.tar.gz -C "$RUNNER_TEMP/nsh"
          echo "$RUNNER_TEMP/nsh/nsh/bin" >> "$GITHUB_PATH"
      - run: nsh --version
      - name: Type check
        run: nsh check app
      - name: UI tests
        working-directory: app
        run: nsh test
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with: { bun-version-file: package.json }
      - if: steps.bun.outcome == 'failure'
        run: npm install -g "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      # Where views sit, which the tests above can't ask (scripts/check-layout.ts).
      - name: Layout
        run: |
          (cd app && nsh test screens.test.tsx --trace) > "$RUNNER_TEMP/layout-trace.txt" 2>&1 || { tail -50 "$RUNNER_TEMP/layout-trace.txt"; exit 1; }
          bun scripts/check-layout.ts "$RUNNER_TEMP/layout-trace.txt"
      # Pictures of the main desktop screens in headless Chrome, to look at (the `screens` artifact).
      - name: Screenshots
        env: { NSH_BROWSER: /usr/bin/google-chrome }
        run: scripts/screens.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screens, path: app/.nsh/screens/*.png, if-no-files-found: warn }
